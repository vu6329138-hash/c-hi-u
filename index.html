    <style>
        /* ==========================================
           1. RESET & BASIC STYLES
           ========================================== */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-deep-green: #0b2318;
            --bg-dark-emerald: #05140d;
            --primary-gold: #d4af37;
            --light-gold: #fcf6ba;
            --dark-gold: #aa771c;
            --accent-red: #8b0000;
            --text-gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            --font-title: 'Playfair Display', serif;
            --font-handwriting: 'Dancing Script', cursive;
            --font-body: 'Roboto Slab', serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            font-family: var(--font-body);
            background: radial-gradient(circle at center, var(--bg-deep-green) 0%, var(--bg-dark-emerald) 100%);
            color: #f1f1f1;
        }

        /* ==========================================
           2. CANVAS BACKGROUND (BUỊ PHẤN & SAO SÁNG)
           ========================================== */
        #dustCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* ==========================================
           3. MAIN CONTAINER & BACKGROUND PATTERN
           ========================================== */
        .wrapper {
            position: relative;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            z-index: 2;
        }

        .border-overlay {
            position: fixed;
            top: 15px;
            left: 15px;
            right: 15px;
            bottom: 15px;
            border: 2px solid rgba(212, 175, 55, 0.3);
            pointer-events: none;
            z-index: 3;
        }

        .border-overlay::after {
            content: '';
            position: absolute;
            top: 5px;
            left: 5px;
            right: 5px;
            bottom: 5px;
            border: 1px dashed rgba(212, 175, 55, 0.2);
        }

        /* ==========================================
           4. STAGE 1: BAO THƯ PHONG PHONG CÁCH CỔ ĐIỂN
           ========================================== */
        .envelope-container {
            position: relative;
            width: 100%;
            max-width: 520px;
            perspective: 1000px;
            cursor: pointer;
            text-align: center;
            transition: transform 0.4s ease;
        }

        .envelope-container:hover {
            transform: translateY(-8px);
        }

        .envelope-body {
            position: relative;
            width: 100%;
            height: 340px;
            background: #113826;
            border: 3px solid var(--primary-gold);
            border-radius: 12px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8),
                        inset 0 0 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            overflow: hidden;
        }

            height: 90px;
